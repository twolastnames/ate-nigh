aggregations:
  - name: Food
    model: Food
    response:
      type: Food
      require: true
    finalizer: haveOne
    pipeline:
      - $match:
          persistantId:
            anParameter:
              name: id
              schema:
                type: number
                format: number
                required: true
      - $limit: 1

  - name: Ate
    model: Ate
    response:
      type: Ate
      require: true
    finalizer: haveOne
    pipeline:
      - $match:
          id:
            anParameter:
              name: id
              schema:
                type: number
                format: number
                required: true
      - $limit: 1

#      persistantId: $data-an-id
#      persistantId: 2705383
types:
  Nutrient:
    persistantId:
      type: Number
      required: true
    name:
      type: String
      required: true
    units:
      type: String
      required: true
    amount:
      type: Number
      required: true
collections:
  Ate:
    persistantId:
      type: Number
      index: true
      unique: true
    amount:
      type: Number
      required: true
    nutrientId:
      type: Number
      required: true
    time:
      type: Date
      required: true
  Food:
    persistantId:
      type: Number
      index: true
      unique: true
      required: true
    description:
      type: String
      required: true
    nutrients:
      type:
        - Nutrient

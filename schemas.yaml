aggregations:
  - name: Food
    model: Food
    response:
      type: Food
      require: true
    finalizer: haveOne
    pipeline:
      - $match:
          persistantId:
            anParameter:
              name: id
              schema:
                type: number
                format: number
                required: true
      - $limit: 1

  - name: Ate
    model: Ate
    response:
      type: Ate
      require: true
    finalizer: haveOne
    pipeline:
      - $match:
          id:
            anParameter:
              name: id
              schema:
                type: number
                format: number
                required: true
      - $limit: 1

  - name: Ates
    model: Ate
    response:
      type: [Ate]
      require: true
    finalizer: raw
    pipeline:
      - $match:
          time:
            $gte:
              anParameter:
                name: from
                schema:
                  type: Date
                  format: Date
                  required: true
            $lt:
              anParameter:
                name: to
                schema:
                  type: Date
                  format: Date
                  required: true

  - name: Nutrients
    model: Ate
    response:
      type: [Nutrient]
      require: true
    finalizer: raw
    pipeline:
      - $match:
          time:
            $gte:
              anParameter:
                name: from
                schema:
                  type: Date
                  format: Date
                  required: true
            $lt:
              anParameter:
                name: to
                schema:
                  type: Date
                  format: Date
                  required: true
      - $lookup:
          from: foods
          localField: foodId
          foreignField: persistantId
          as: food
      - $unwind: $food
      - $unwind: $food.nutrients
      - $project:
          persistantId: $food.nutrients.persistantId
          name: $food.nutrients.name
          units: $food.nutrients.units
          amount: $food.nutrients.amount
      - $group:
          _id: $name
          name:
            $first: $name
          units:
            $first: $units
          amount:
            $sum: $amount

#      persistantId: $data-an-id
#      persistantId: 2705383
types:
  Nutrient:
    persistantId:
      type: Number
      required: true
    name:
      type: String
      required: true
    units:
      type: String
      required: true
    amount:
      type: Number
      required: true
collections:
  Ate:
    persistantId:
      type: Number
      index: true
      unique: true
    amount:
      type: Number
      required: true
    foodId:
      type: Number
      required: true
    time:
      type: Date
      required: true
  Food:
    persistantId:
      type: Number
      index: true
      unique: true
      required: true
    description:
      type: String
      required: true
    nutrients:
      type:
        - Nutrient
